name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Full history, so the path guard can walk every commit since origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bats parallel shellcheck
      - run: npm ci
      - run: make lint test-unit
      - run: bin/path-guard --range origin/main..HEAD
